<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='desingcalcular.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calcule seus gastos energéticos</title>
</head>

<body>
    <h1>Calcule seus gastos energéticos</h1>
    <p class="introducao">Comece pelos seus dados para estimar o gasto de energia em repouso.</p>
    <hr>

    <form action="{{ url_for('gastos_energeticos') }}" method="post">
        <input type="hidden" name="etapa" value="basal">
        <div class="etapa">ETAPA 1 DE 2</div>
        <h2>Seus dados</h2>
        <div class="campos">
        <div class="campo"><label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" required value="61"></div>

        <div class="campo"><label for="altura">Altura (cm):</label>
        <input type="number" id="altura" name="altura" required value="169"></div>

        <div class="campo"><label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" required value="21"></div>

        <div class="campo"><label for="gender">Gênero:</label>
        <select id="gender" name="gender" required>
            <option value="">Selecione</option>
            <option value="male" selected>Masculino</option>
            <option value="female">Feminino</option>
        </select></div>
        </div>
        <input type="submit" value="Calcular e continuar →" id="calcular"> 
    </form>

    {% if calorias_academia is defined %}
    <p>Gasto por treino: {{ calorias_academia }} kcal.</p>
    {% endif %}

    {% if error %}
    <p role="alert">{{ error }}</p>
    {% endif %}


    <a class="voltar" href="/">← Voltar ao início</a>
</body>

</html>
